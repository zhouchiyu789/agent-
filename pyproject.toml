[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-python-starter"
version = "0.1.0"
description = "Six-week Python, FastAPI and LangGraph learning project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "pydantic>=2,<3",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
include = ["agent_starter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
