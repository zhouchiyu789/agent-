services:
  agent-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_API_KEY: ${APP_API_KEY:-dev-token}
      ORDER_API_URL: ${ORDER_API_URL:-http://host.docker.internal:8001}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 3
